[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lenswalk"
version = "0.1.0"
description = "Inference code for LensWalk: Agentic Video Understanding by Planning How You See in Videos."
readme = "README.md"
requires-python = ">=3.9,<3.12"
license = { file = "LICENSE" }
dependencies = [
  "openai>=1.66.0",
  "socksio>=1.0",
  "transformers>=4.45,<5",
  "PyYAML>=6.0",
  "pydantic>=2.6,<3",
  "numpy>=1.24,<3",
  "pandas>=1.5",
  "xlsxwriter>=3.1",
  "opencv-python-headless>=4.8",
  "Pillow>=9.0",
  "decord>=0.6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["benchmarks*", "utils*", "vcs*"]
namespaces = true
